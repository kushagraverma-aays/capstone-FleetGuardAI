name: Deploy to Databricks
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - run: |
          # 1. Copy all new backend code into the Databricks app folder
          cp -r fleetguard-backend/app fleetguard-databricks-app/
          cp -r fleetguard-backend/scripts fleetguard-databricks-app/
             
          # 2. Build the frontend
          cd fleetguard-frontend
          npm install && npm run build
             
          # 3. Copy built frontend into the static folder
          cp -r dist/* ../fleetguard-databricks-app/static/
      - uses: databricks/setup-cli@main
      - env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          # 1. Sync the fresh code from GitHub into your personal workspace folder
          databricks sync ./fleetguard-databricks-app /Workspace/Users/gauravb0520@gmail.com/fleetguard-databricks-app
          
          # 2. Deploy the app to Databricks!
          databricks apps deploy fleetguard-ai --source-code-path /Workspace/Users/gauravb0520@gmail.com/fleetguard-databricks-app

      # ── Deploy to Azure App Service (Public Client Website) ─────────────────
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'fleetguard-ai'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './fleetguard-databricks-app'