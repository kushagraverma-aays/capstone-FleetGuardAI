services:
  mysql:
    image: mysql:8.0
    container_name: fleetguard-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-fleetguard}
      MYSQL_DATABASE: ${MYSQL_DB:-fleetguard}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-fleetguard}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build: ./fleetguard-backend
    container_name: fleetguard-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fleetguard}
      MYSQL_DB: ${MYSQL_DB:-fleetguard}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    # Migrate, then seed if the database is empty, then serve.
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.manage seed --if-empty &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./fleetguard-frontend
    container_name: fleetguard-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
