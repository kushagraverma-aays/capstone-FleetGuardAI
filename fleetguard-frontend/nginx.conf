# The app and the API answer on one origin.
#
# That is the whole reason this file exists: the browser calls /api/... on the
# same host it loaded the page from, nginx forwards those to the backend
# container, and the client needs no base URL, no CORS preflight and no build
# flag that differs between development and Docker.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames, so these can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves browsers loading an
    # old page that references asset names which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The assistant's tool loop can take a while on a multi-round question;
        # the default 60s would cut it off mid-answer.
        proxy_read_timeout 120s;
    }

    # Client-side routing: /fleet/VIN is a route in the bundle, not a file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
